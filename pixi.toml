[workspace]
name = "dseams-plumed"
version = "0.1.0"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64"]
authors = ["Rohit Goswami <rgoswami@ieee.org>"]

[dependencies]
plumed = ">=2.9"
compilers = ">=1.9.0,<2"
rust = ">=1.85"
eigen = "3.4.0.*"
libblas = ">=3.11.0,<4"
liblapack = ">=3.11.0,<4"
meson = ">=1.3.0"
ninja = ">=1.13.2,<2"
pkgconfig = ">=1.5.5,<2"
python = "3.12.*"
libhwy = ">=1.3.0"
chemfiles = ">=0.10"
catch2 = ">=3.6.0,<4"
git = "*"

[tasks]
setup = "meson setup build --buildtype=release"
build = { cmd = "meson compile -C build", depends-on = ["setup"] }
test = { cmd = "meson test -C build --print-errorlogs", depends-on = ["build"] }
