[workspace]
name = "dseams-plumed"
description = """\
PLUMED Colvar DSEAMS_CAGES: the d-SEAMS topological ice score, per frame, \
on a group of oxygen atoms read from the host MD engine. Builds the \
mutual/union four-nearest-neighbour graphs, primitive six-membered rings \
and seeded hexagonal/double-diamond cage assignment (nice, nmax, nclus, \
nic, nih, nmixed), CHILL+ on the cutoff graph (chillice, chillmax, \
chillinterfacial), six-ring census (sixrings), ion brine rejection against \
the water assignment (nionice, nionfront, nionliq), local topology-key \
classification and LIBRARY naming (nclasses, nnamed), ring-size SIGNATURE \
cage counting (ncages) and guest occupancy (noccupied, nmultiple, \
nfreeguest). Frames come from PLUMED's getPosition()/getBox(), not a \
structure file; the only file this action reads is a plain-text LIBRARY of \
topology keys. The linked seams-core engine optionally reads PDB/GRO/DCD \
(chemfiles) and .con (readcon-core) for its own CLI, which this module's \
dseams_plumed_has_chemfiles()/dseams_plumed_has_readcon() report but do \
not use."""
# [[[cog import re; cog.outl('version = "%s"' % re.search(r"version:\s*'([^']+)'", open("meson.build").read()).group(1))]]]
version = "0.4.1"
# [[[end]]]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64"]
authors = ["Rohit Goswami <rgoswami@ieee.org>"]

# seams-core is not a conda package here. The pin is the meson wrap tag
# v2.14.0 in subprojects/seams-core.wrap. check-engine-pin reads that line.

[dependencies]
plumed = ">=2.9"
compilers = ">=1.9.0,<2"
rust = ">=1.85"
eigen = "3.4.0.*"
libblas = ">=3.11.0,<4"
liblapack = ">=3.11.0,<4"
meson = ">=1.3.0"
ninja = ">=1.13.2,<2"
pkgconfig = ">=1.5.5,<2"
python = "3.12.*"
libhwy = ">=1.3.0"
chemfiles = ">=0.10"
catch2 = ">=3.6.0,<4"
git = "*"

[tasks]
check-engine-pin = "python tests/check_engine_pin.py"
setup = { cmd = "meson setup build --buildtype=release -Dseams-core:with_tests=false", depends-on = ["check-engine-pin"] }
build = { cmd = "meson compile -C build", depends-on = ["setup"] }
test = { cmd = "meson test -C build --print-errorlogs", depends-on = ["build"] }

# cogapp and towncrier are release tooling, kept out of the default
# environment so the plain build/test loop pulls nothing extra. cocogitto
# (the `cog` binary) is not conda-forge packaged; install it with
# `cargo install cocogitto --locked` (see
# docs/orgmode/contributing/developer/release.org).
# conda-forge ships cogapp for linux-64/osx-64 only (no osx-arm64 build).
[feature.version]
platforms = ["linux-64", "osx-64"]

[feature.version.dependencies]
cogapp = ">=3.3.0,<4"
towncrier = ">=24,<27"

[feature.version.tasks]
# Rewrites every copy in ci/version/files.txt from meson.build's version.
release-cog = "python -m cogapp -I ci/version -r @ci/version/files.txt"
# Fails when a copy has drifted from meson.build without rewriting it.
version-drift = "python -m cogapp -I ci/version --check @ci/version/files.txt"
towncrier-draft = "towncrier build --draft"
towncrier-build = "towncrier build --yes"

[environments]
version = { features = ["version"], no-default-feature = true }
