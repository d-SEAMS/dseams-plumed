site_name: dseams-plumed
site_description: PLUMED action for d-SEAMS topological ice and cage analysis with the Chemical Identification of Local Liquid-like and Solid-like Habitats Plus classifier
site_url: https://plumed.dseams.info/
repo_url: https://github.com/d-SEAMS/dseams-plumed
repo_name: d-SEAMS/dseams-plumed
edit_uri: edit/main/docs/
hooks:
  - scripts/seo.py
exclude_docs: |
  requirements.txt
copyright: MIT licensed. Cite 10.1021/acs.jcim.0c00031.

theme:
  name: material
  custom_dir: overrides
  favicon: assets/favicon.ico
  font: false
  features:
    - content.code.copy
    - navigation.sections
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Light mode

extra_css:
  - stylesheets/dseams-tokens.css
  - stylesheets/dseams-family.css
  - stylesheets/dseams-mkdocs.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences

nav:
  - Home: index.md
  - Install: install.md
  - Keyword reference: keywords.md
  - Cages and guests: cages.md
  - Ions: ions.md
  - Topology keys: topology.md
  - Inside LAMMPS: lammps.md
  - Driver tests: tests.md
  - Citation: citation.md
