name: CI
on:
  push:
    branches: [main, "release/**"]
    tags: ["v*"]
  pull_request:
    branches: [main, "release/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  versions:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Versions follow meson.build
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, pathlib, re, sys
          root = pathlib.Path(".")
          want = re.search(r"version: '([^']+)'", (root / "meson.build").read_text()).group(1)
          bad = []
          for path, pattern in {
              "pixi.toml": r'(?m)^version = "([^"]+)"',
              "CITATION.cff": r'(?m)^version: "([^"]+)"',
          }.items():
              got = re.search(pattern, (root / path).read_text()).group(1)
              if got != want:
                  bad.append(f"{path}: {got}")
          if f"## [{want}]" not in (root / "CHANGELOG.md").read_text():
              bad.append(f"CHANGELOG.md has no [{want}] section")
          if os.environ["REF_TYPE"] == "tag" and os.environ["REF_NAME"] != f"v{want}":
              bad.append(f"tag {os.environ['REF_NAME']}")
          sys.exit("meson.build is {}; {}".format(want, "; ".join(bad)) if bad else 0)
          PY

  build-test:
    name: build-test (PLUMED ${{ matrix.series }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: plumed29
            series: "2.9"
          - environment: plumed210
            series: "2.10"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
        with:
          environments: ${{ matrix.environment }}
          cache-key: pixi-${{ matrix.environment }}-
          locked: true
      - name: The environment holds PLUMED ${{ matrix.series }}
        env:
          ENVIRONMENT: ${{ matrix.environment }}
          SERIES: ${{ matrix.series }}
        run: |
          got=$(pixi run -e "$ENVIRONMENT" plumed info --version | tail -n 1)
          if [ "$got" != "$SERIES" ]; then
            echo "$ENVIRONMENT expected PLUMED $SERIES, got $got" >&2
            exit 1
          fi
      - run: pixi run -e ${{ matrix.environment }} test
