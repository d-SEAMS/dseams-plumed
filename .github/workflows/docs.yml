name: Docs
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -r docs/requirements.txt
      - name: Build and validate documentation SEO
        run: |
          mkdocs build --strict
          python scripts/seo.py --check site
      - name: Link check
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress --max-retries 3 --accept 200,206,429
            --root-dir ${{ github.workspace }}/site
            --exclude-path site/404.html
            README.org 'site/**/*.html'
          fail: true
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        if: github.event_name == 'push'
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name == 'push'
        with:
          path: site

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

  # The site as readers get it: every published page is a lychee input,
  # so relative links resolve against the page they are on. The page list
  # comes from the artifact the deploy job published.
  live-links:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: github-pages
          path: pages
      - name: Page list
        run: |
          tar -tf pages/artifact.tar | grep '\.html$' | grep -v -e '_static/' -e '404\.html$' \
            | sed 's#^\./##; s#^#https://plumed.dseams.info/#' > pages.txt
          wc -l pages.txt
          test -s pages.txt
      - name: Check links on the published site
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress --max-retries 3 --accept 200,206,429
            --exclude '^https://doi\.org/10\.1021/'
            --files-from pages.txt
          fail: true
