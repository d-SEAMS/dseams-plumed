instructions: >
  DSEAMS_CAGES is the d-SEAMS topological ice score as a PLUMED action
  with no derivatives. The three actions in plumed.dat score ice
  nucleation, a brine front, and the filled cages of a methane hydrate.
  PLUMED 2.9 or later with a C++17 compiler. LOAD FILE=dseams_plumed.cpp
  compiles the generated action and the required seams-core v2.14.0
  implementation from the archive; no installed d-SEAMS library is
  required. The included frame.xyz runs all three actions and has pinned
  ICE, BRINE, and HYDRATE reference outputs. ATOMS is one oxygen per
  water, IONS one atom per ion, and GUESTS one atom per guest. The
  methods paper is 10.1021/acs.jcim.0c00031.
